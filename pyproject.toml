[project]
name = "friday-backend"
version = "0.1.0"
description = "FRIDAY AI - Production-minded, local-first backend for personal AI work assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.2",
    "sqlalchemy[asyncio]>=2.0.35",
    "greenlet>=3.1.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.3",
    "croniter>=2.0.0",
    "python-multipart>=0.0.12",
    "beautifulsoup4>=4.15.0",
    "playwright>=1.64.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B904", "UP042"]
